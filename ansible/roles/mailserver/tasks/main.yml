- name: Configure persistent data disk and service bind mounts
  ansible.builtin.include_tasks: storage.yml

# Fixed IDs keep ownership of the persistent data valid when the boot disk is rebuilt.
- name: Create service groups with the IDs that own the persistent data
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.id }}"
    system: true
  loop:
    - { name: mysql, id: 108 }
    - { name: redis, id: 109 }

- name: Create service users with the IDs that own the persistent data
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    home: "{{ item.home }}"
  loop:
    - { name: mysql, uid: 104, home: /nonexistent }
    - { name: redis, uid: 105, home: /var/lib/redis }

- name: Create a 2 GiB swap file
  become: true
  ansible.builtin.command: fallocate -l 2G /swapfile
  args:
    creates: /swapfile

- name: Restrict swap file permissions
  become: true
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Format the swap file when it has no swap signature
  become: true
  ansible.builtin.shell: blkid -p /swapfile >/dev/null 2>&1 || mkswap /swapfile
  register: swapfile_format
  changed_when: "'Setting up swapspace' in swapfile_format.stdout"

- name: Persist the swap file in fstab
  become: true
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: /swapfile none swap sw 0 0

- name: Check active swap
  become: true
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: active_swap
  changed_when: false

- name: Enable the swap file
  become: true
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in active_swap.stdout"

- name: Check for incomplete package configuration
  become: true
  ansible.builtin.command: dpkg --audit
  register: dpkg_audit
  changed_when: false

- name: Complete package configuration interrupted by a previous run
  become: true
  ansible.builtin.command:
    argv:
      - dpkg
      - --force-confdef
      - --force-confold
      - --configure
      - --pending
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: dpkg_audit.stdout | trim | length > 0

- name: Verify package configuration is complete before upgrading
  become: true
  ansible.builtin.command: dpkg --audit
  register: dpkg_audit_after
  changed_when: false
  failed_when: dpkg_audit_after.rc != 0 or (dpkg_audit_after.stdout | trim | length > 0)

- name: Update installed packages from configured repositories
  become: yes
  apt:
    update_cache: yes
    upgrade: dist
    fail_on_autoremove: yes
    dpkg_options: force-confdef,force-confold
    lock_timeout: 300

- name: "Configure Timezone"
  become: yes
  shell: |
          echo "Europe/Tallinn" > /etc/timezone && \
          dpkg-reconfigure -f noninteractive tzdata 

- name: "support install postfix non-interactively"
  become: yes
  shell: |
          echo "postfix postfix/mailname string {{ main_hostname }}" | debconf-set-selections
          echo "postfix postfix/main_mailer_type string 'Internet Site'" | debconf-set-selections
          apt-get -y install postfix

- name: Replace hostname in postfix config
  become: yes
  lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^myhostname'
    line: myhostname = {{ main_hostname }}

- name: Update or Create sasl password file
  become: yes
  lineinfile:
    path: /etc/postfix/sasl_passwd
    create: yes
    line: "{{ item.name }}  {{ item.smtp_cred }}"
  loop: "{{ smtp_credentials }}"
  no_log: yes

- name: Replace relayhost in postfix config
  become: yes
  lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^relayhost'
    line: relayhost = [smtp.mailgun.org]:587

- name: Insert/Update lines in postfix config
  become: yes
  blockinfile:
    path: /etc/postfix/main.cf
    marker: "# {mark} ANSIBLE MANAGED BLOCK sasl auth"
    block: |
      smtp_sasl_auth_enable = yes
      smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd
      smtp_sasl_security_options = noanonymous
      smtp_sender_dependent_authentication = yes
      smtp_tls_security_level = encrypt
      message_size_limit = 30720000

- name: Create Postfix Hash map
  become: yes
  shell: |
          postmap /etc/postfix/sasl_passwd
          rm /etc/postfix/sasl_passwd

- name: Set Postfix db permissions
  become: yes
  file:
    path: /etc/postfix/sasl_passwd.db
    mode: '0600'
  notify:
    - Restart Postfix Service

- name: Install Required applications
  become: yes
  apt:
    state: present
    pkg:
      - acl
      - certbot
      - linux-image-cloud-amd64
      - dovecot-core 
      - dovecot-imapd 
      - dovecot-lmtpd
      - dovecot-mysql
      - dovecot-sieve
      - mariadb-server
      - nginx 
      - php-mbstring
      - php-fpm
      - php-mysql
      - php-intl
      - php-xml 
      - postfix-mysql
      - python3-certbot-nginx
      - redis-server 
      - rspamd
      - wget

- name: Find the installed PHP-FPM socket dynamically
  become: true
  ansible.builtin.shell: |
    find /run/php -maxdepth 1 -type s -name 'php*-fpm.sock' -print | sort -V | tail -n 1
  args:
    executable: /bin/bash
  register: detected_php_fpm_socket
  changed_when: false

- name: Require an active-version PHP-FPM socket
  ansible.builtin.assert:
    that:
      - detected_php_fpm_socket.stdout | trim | length > 0
    fail_msg: "No PHP-FPM socket was found in /run/php after installing the role packages."

- name: Set dynamic PHP-FPM socket path
  ansible.builtin.set_fact:
    php_fpm_socket_path: "{{ detected_php_fpm_socket.stdout | trim }}"

- name: Detect the installed MariaDB client command
  become: true
  ansible.builtin.shell: command -v mariadb || command -v mysql
  args:
    executable: /bin/bash
  register: detected_mariadb_client
  changed_when: false

- name: Set the installed MariaDB client command
  ansible.builtin.set_fact:
    mariadb_client_path: "{{ detected_mariadb_client.stdout | trim }}"

- name: Select certificate provisioning mode
  ansible.builtin.set_fact:
    requested_mail_certificate_mode: "{{ certificate_mode | default('auto') }}"

- name: Validate certificate provisioning mode
  ansible.builtin.assert:
    that:
      - requested_mail_certificate_mode in ['auto', 'standalone', 'existing']
    fail_msg: "certificate_mode must be auto, standalone or existing."

- name: Require the primary mail hostname in the configured mail domains
  ansible.builtin.assert:
    that:
      - main_hostname in (domainlist | map(attribute='mail_domain') | list)
    fail_msg: "main_hostname must be included in domainlist so its certificate is verified."

- name: Inspect existing mail-domain certificates for automatic mode
  become: true
  ansible.builtin.stat:
    follow: true
    path: "/etc/letsencrypt/live/{{ item.0.mail_domain }}/{{ item.1 }}"
  loop: "{{ domainlist | product(['fullchain.pem', 'privkey.pem']) | list }}"
  loop_control:
    label: "/etc/letsencrypt/live/{{ item.0.mail_domain }}/{{ item.1 }}"
  register: existing_mail_certificate_files
  when: requested_mail_certificate_mode == 'auto'

- name: Use existing certificates when complete, otherwise issue them
  ansible.builtin.set_fact:
    mail_certificate_mode: >-
      {{ 'existing' if (existing_mail_certificate_files.results
      | selectattr('stat.exists') | selectattr('stat.isreg') | list | length)
      == (domainlist | length * 2) else 'standalone' }}
  when: requested_mail_certificate_mode == 'auto'

- name: Use explicitly configured certificate mode
  ansible.builtin.set_fact:
    mail_certificate_mode: "{{ requested_mail_certificate_mode }}"
  when: requested_mail_certificate_mode != 'auto'

- name: Obtain certificates using standalone HTTP validation
  become: true
  when: mail_certificate_mode == 'standalone'
  block:
    - name: Stop Nginx before standalone certificate issuance
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: true

    - name: Generate certificates for mail domains
      ansible.builtin.shell: |
        certbot certonly --standalone -d {{ item.mail_domain }} --non-interactive --agree-tos -m {{ item.webmaster }}
      loop: "{{ domainlist }}"

    - name: Generate certificates for configured websites
      ansible.builtin.shell: |
        certbot certonly --standalone -d {{ item.domain }} -d www.{{ item.domain }} --non-interactive --agree-tos -m webmaster@{{ item.domain }} --expand
      loop: "{{ website_domains }}"
      ignore_errors: true
  always:
    - name: Ensure Nginx is running after standalone certificate issuance
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

- name: Check mail-domain certificates and private keys
  become: true
  ansible.builtin.stat:
    follow: true
    path: "/etc/letsencrypt/live/{{ item.0.mail_domain }}/{{ item.1 }}"
  loop: "{{ domainlist | product(['fullchain.pem', 'privkey.pem']) | list }}"
  loop_control:
    label: "/etc/letsencrypt/live/{{ item.0.mail_domain }}/{{ item.1 }}"
  register: mail_certificate_stats
  when: mail_certificate_mode != 'existing' or requested_mail_certificate_mode != 'auto'

- name: Require mail-domain certificate files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Missing expected certificate or private key for {{ item.item.0.mail_domain }}."
  loop: "{{ mail_certificate_stats.results }}"
  loop_control:
    label: "{{ item.item.0.mail_domain }}/{{ item.item.1 }}"
  when: mail_certificate_mode != 'existing' or requested_mail_certificate_mode != 'auto'

- name: Check website certificates and private keys
  become: true
  ansible.builtin.stat:
    follow: true
    path: "/etc/letsencrypt/live/{{ item.0.domain }}/{{ item.1 }}"
  loop: "{{ website_domains | product(['fullchain.pem', 'privkey.pem']) | list }}"
  loop_control:
    label: "/etc/letsencrypt/live/{{ item.0.domain }}/{{ item.1 }}"
  register: website_certificate_stats

- name: Require website certificate files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Missing expected certificate or private key for website {{ item.item.0.domain }}."
  loop: "{{ website_certificate_stats.results }}"
  loop_control:
    label: "{{ item.item.0.domain }}/{{ item.item.1 }}"

- name: Create Nginx config for websites
  become: yes
  template:
    src: website.nginx.j2
    dest: /etc/nginx/sites-available/{{ item.domain }}
  loop: "{{ website_domains }}"
  notify: Reload Nginx Service

- name: Enable website configs
  become: yes
  file:
    src: /etc/nginx/sites-available/{{ item.domain }}
    dest: /etc/nginx/sites-enabled/{{ item.domain }}
    state: link
  loop: "{{ website_domains }}"
  notify: Reload Nginx Service

- name: Create Postfix SSL Map
  become: yes
  blockinfile:
    create: yes
    path: /etc/postfix/ssl_map
    block: |
      {{ item.mail_domain }}
          /etc/letsencrypt/live/{{ item.mail_domain }}/privkey.pem
          /etc/letsencrypt/live/{{ item.mail_domain }}/fullchain.pem
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item.mail_domain }}"
  with_items: 
    - "{{ domainlist }}"

- name: Hash Postfix SSL map
  become: yes
  shell: sudo postmap -F hash:/etc/postfix/ssl_map      

- name: Insert SSL map postfix config
  become: yes
  blockinfile:
    path: /etc/postfix/main.cf
    block: |
      mailbox_transport = lmtp:unix:private/dovecot-lmtp
      tls_server_sni_maps = hash:/etc/postfix/ssl_map
      smtpd_tls_mandatory_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
      smtpd_tls_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
      smtp_tls_mandatory_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
      smtp_tls_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1
      smtputf8_enable = no
      smtpd_milters = unix:/var/run/rspamd/milter.sock
      milter_default_action = accept

- name: Enable port 587 and 465 postfix
  become: yes
  blockinfile:
    marker: "{mark}"
    marker_begin: "#tlsproxy  unix  -       -       y       -       0       tlsproxy"
    marker_end: "#628       inet  n       -       y       -       -       qmqpd"
    path: /etc/postfix/master.cf
    block: |
      submission inet n       -       y       -       -       smtpd
       -o syslog_name=postfix/submission
       -o smtpd_tls_security_level=encrypt
       -o smtpd_sasl_auth_enable=yes
       -o smtpd_tls_auth_only=yes
       -o smtpd_reject_unlisted_recipient=no
        -o smtpd_client_restrictions=permit
        -o smtpd_helo_restrictions=permit
        -o smtpd_sender_restrictions=permit
        -o smtpd_recipient_restrictions=permit_sasl_authenticated,reject
       -o smtpd_relay_restrictions=permit_sasl_authenticated,reject
       -o smtpd_sasl_type=dovecot
       -o smtpd_sasl_path=private/auth
       -o milter_macro_daemon_name=ORIGINATING
      smtps     inet  n       -       y       -       -       smtpd
       -o syslog_name=postfix/smtps
       -o smtpd_tls_wrappermode=yes
       -o smtpd_sasl_auth_enable=yes
       -o smtpd_reject_unlisted_recipient=no
        -o smtpd_client_restrictions=permit
        -o smtpd_helo_restrictions=permit
        -o smtpd_sender_restrictions=permit
        -o smtpd_recipient_restrictions=permit_sasl_authenticated,reject
       -o smtpd_relay_restrictions=permit_sasl_authenticated,reject
       -o smtpd_sasl_type=dovecot
       -o smtpd_sasl_path=private/auth
       -o milter_macro_daemon_name=ORIGINATING

- name: Ensure Certbot renewal hook directories exist
  become: true
  ansible.builtin.file:
    path: "/etc/letsencrypt/renewal-hooks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: [pre, post, deploy]

- name: Stop Nginx before standalone Certbot renewal attempts
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/pre/stop-nginx
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      systemctl stop nginx

- name: Restart Nginx after standalone Certbot renewal attempts
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/post/start-nginx
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      systemctl start nginx

- name: Reload mail and web services after certificate renewal
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/mail-services
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      setfacl -R -m u:www-data:rx /etc/letsencrypt/live/ /etc/letsencrypt/archive/
      postmap -F hash:/etc/postfix/ssl_map
      systemctl start nginx
      systemctl reload nginx
      systemctl restart postfix
      systemctl restart dovecot

- name: Enable automatic Certbot renewal timer
  become: true
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started

- name: Install Dovecot 2.4 configuration
  become: true
  ansible.builtin.template:
    src: dovecot-2.4.conf.j2
    dest: /etc/dovecot/dovecot.conf
    owner: root
    group: dovecot
    mode: '0640'
  no_log: true
  notify: Restart Dovecot Service

- name: Validate Dovecot configuration
  become: true
  ansible.builtin.command: doveconf -n
  changed_when: false
  no_log: true

- name: Configure MariaDB database
  become: yes
  shell: |
    #!/bin/bash
    set -euo pipefail
    db_args=(--user=root)
    if ! "{{ mariadb_client_path }}" --user=root --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then
      db_args+=(--password='{{ mariadb_root_password }}')
    fi
    "{{ mariadb_client_path }}" "${db_args[@]}" <<'SQL'
    ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket;
    DELETE FROM mysql.global_priv WHERE User='';
    DELETE FROM mysql.global_priv WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1');
    DROP DATABASE IF EXISTS test;
    DELETE FROM mysql.db WHERE Db='test' OR Db='test\\_%';
    CREATE DATABASE IF NOT EXISTS postfix;
    CREATE OR REPLACE USER 'postfix'@'%' IDENTIFIED BY '{{ mariadb_postfix_password }}';
    GRANT ALL PRIVILEGES ON postfix.* TO 'postfix'@'%';
    CREATE DATABASE IF NOT EXISTS roundcube;
    CREATE OR REPLACE USER 'roundcube'@'%' IDENTIFIED BY '{{ mariadb_postfix_password }}';
    GRANT ALL PRIVILEGES ON roundcube.* TO roundcube@'%';
    FLUSH PRIVILEGES;
    SQL
  args:
    executable: /bin/bash
  no_log: yes

- name: Check installed Roundcube version
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "define('RCMAIL_VERSION', '{{ roundcube_version }}')"
      - /opt/roundcube/program/include/iniset.php
  register: roundcube_installed_version
  changed_when: false
  failed_when: false

- name: Remove Roundcube directory when the pinned version changes
  become: true
  ansible.builtin.file:
    path: /opt/roundcube
    state: absent
  when: roundcube_installed_version.rc != 0

- name: Download Roundcube
  unarchive:
    src: https://github.com/roundcube/roundcubemail/releases/download/{{ roundcube_version }}/roundcubemail-{{ roundcube_version }}-complete.tar.gz
    dest: /opt
    remote_src: yes
  when: roundcube_installed_version.rc != 0

- name: Change roundcube directory name
  become: yes
  shell: mv /opt/roundcubemail-{{ roundcube_version }} /opt/roundcube
  when: roundcube_installed_version.rc != 0

- name: Create a roundcube symlink in html 
  become: yes
  file:
    src: /opt/roundcube
    dest: /var/www/html/roundcube
    state: link

- name: www-data user own temps, logs and schema
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true
  loop:
    - /opt/roundcube/temp
    - /opt/roundcube/logs

- name: Initialize Roundcube schema on first install
  become: true
  ansible.builtin.shell: "{{ mariadb_client_path }} roundcube < /opt/roundcube/SQL/mysql.initial.sql --force"
  when: roundcube_installed_version.rc != 0

- name: Add roundcube config
  become: yes
  blockinfile:
    path: /opt/roundcube/config/config.inc.php
    create: yes
    block: |
      <?php
      $config['db_dsnw'] = 'mysql://roundcube:{{ mariadb_postfix_password }}@127.0.0.1/roundcube';
      $config['imap_host'] = [{% for item in domainlist %}'ssl://{{ item.mail_domain }}:993'{% if not loop.last %}, {% endif %}{% endfor %}];
      $config['smtp_host'] = [{% for item in domainlist %}'{{ item.mail_domain }}' => 'tls://{{ item.mail_domain }}:587'{% if not loop.last %}, {% endif %}{% endfor %}];
      $config['support_url'] = '';
      $config['des_key'] = '{{ roundcube_des_key }}';
      $config['product_name'] = 'Nebed Postbox';
      $config['plugins'] = ['acl', 'additional_message_headers', 'archive', 'attachment_reminder', 'emoticons'];
  no_log: yes

- name: Update Roundcube database schema for the configured release
  become: yes
  command:
    argv:
      - php
      - /opt/roundcube/bin/update.sh
      - "--version={{ roundcube_version }}"
      - -y
  no_log: yes

- name: Remove roundcube installer
  become: yes
  file:
    path: /opt/roundcube/installer
    state: absent

- name: Add hostnames to hosts
  become: yes
  lineinfile:
    path: /etc/hosts
    regexp: '(127.0.0.1.*)$'
    backrefs: yes
    line: '\1 {{ item.mail_domain }}'
  with_items: 
    - "{{ domainlist }}"

- name: Check installed PostfixAdmin version
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "Version {{ postfixadmin_version }} "
      - /opt/postfixadmin/CHANGELOG.TXT
  register: postfixadmin_installed_version
  changed_when: false
  failed_when: false

- name: Remove PostfixAdmin directory when the pinned version changes
  become: true
  ansible.builtin.file:
    path: /opt/postfixadmin
    state: absent
  when: postfixadmin_installed_version.rc != 0

- name: Download PostfixAdmin when the pinned version changes
  unarchive:
    src: https://github.com/postfixadmin/postfixadmin/archive/postfixadmin-{{ postfixadmin_version }}.tar.gz
    dest: /opt
    remote_src: yes
  when: postfixadmin_installed_version.rc != 0

- name: Rename PostfixAdmin release directory
  become: yes
  shell: mv /opt/postfixadmin-postfixadmin-{{ postfixadmin_version }} /opt/postfixadmin
  when: postfixadmin_installed_version.rc != 0

- name: Create a postfixadmin symlink in html 
  become: yes
  file:
    src: /opt/postfixadmin/public
    dest: /var/www/html/postfixadmin
    state: link

- name: Create postfixadmin setup hash
  ansible.builtin.command: php -r 'echo password_hash("{{ postfixadmin_setup_password }}", PASSWORD_DEFAULT);'
  register: php_hash_output
  no_log: true

- name: Set variable with hash
  ansible.builtin.set_fact:
    postfixadmin_setup_hash: "{{ php_hash_output.stdout }}"
  no_log: true

- name: Create Postfixadmin Config
  become: yes
  blockinfile:
    path: /opt/postfixadmin/config.local.php
    create: yes
    owner: root
    group: www-data
    mode: '0640'
    marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
    block: |
      <?php
        $CONF['database_type'] = 'mysqli';
        $CONF['database_host'] = 'localhost';
        $CONF['database_user'] = 'postfix';
        $CONF['database_password'] = '{{ mariadb_postfix_password }}';
        $CONF['database_name'] = 'postfix';
        $CONF['encrypt'] = 'dovecot:SHA512';
        $CONF['configured'] = true;
        $CONF['setup_password'] = '{{ postfixadmin_setup_hash }}';
      ?>
  no_log: true

- name: Create a postfixadmin directory
  become: yes
  file:
    path: /opt/postfixadmin/templates_c
    state: directory
    owner: www-data
    group: www-data

- name: Update PostfixAdmin database schema for the configured release
  become: yes
  command:
    argv:
      - php
      - -r
      - "define('POSTFIXADMIN_CLI', 1); require 'upgrade.php';"
    chdir: /opt/postfixadmin/public
  no_log: yes

- name: Add user to dovecot group
  become: true
  user:
    name: www-data
    groups: dovecot
    append: yes
  notify: Restart PHP-FPM Service

- name: Update nginx default site
  become: yes
  blockinfile:
    path: /etc/nginx/sites-available/default
    block: |
      #
      server {
              listen 80;
              listen [::]:80;
              server_name _;

              # SSL configuration
              #
              listen 443 ssl default_server;
              listen [::]:443 ssl default_server;
              ssl_certificate /etc/letsencrypt/live/{{ main_hostname }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ main_hostname }}/privkey.pem;
              #
              # Note: You should disable gzip for SSL traffic.
              # See: https://bugs.debian.org/773332
              #
              # Read up on ssl_ciphers to ensure a secure configuration.
              # See: https://bugs.debian.org/765782
              #
              # Self signed certs generated by the ssl-cert package
              # Don't use them in a production server!
              #
              # include snippets/snakeoil.conf;

              root /var/www/html;

              # Add index.php to the list if you are using PHP
              index index.html index.htm index.nginx-debian.html index.php;

              server_name _;

              location / {
                      # First attempt to serve request as file, then
                      # as directory, then fall back to displaying a 404.
                      try_files $uri $uri/ =404;
              }

              # pass PHP scripts to FastCGI server
              #
              location ~ \.php$ {
                    include snippets/fastcgi-php.conf;
              
                    # With php-fpm (or other unix sockets):
                    fastcgi_pass unix:{{ php_fpm_socket_path }};
                    # With php-cgi (or other tcp sockets):
                    # fastcgi_pass 127.0.0.1:9000;
              }

              # Add Rspamd to webserver
              location /rspamd/ {
                    proxy_pass       http://localhost:11334/;

                    proxy_set_header Host      $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              # deny access to .htaccess files, if Apache's document root
              # concurs with nginx's one
              #
              #location ~ /\.ht {
              #       deny all;
              #}
      }
    marker_begin: "# Default server configuration"
    marker_end: "# Virtual Host configuration for example.com"
    marker: "{mark}"
    state: present
  notify:
    - Reload Nginx Service

- name: Update postfix virtual mailbox config
  become: yes
  blockinfile:
    path: /etc/postfix/main.cf
    marker: "# {mark} ANSIBLE MANAGED BLOCK virtual mailbox"
    block: |
      virtual_transport = lmtp:unix:private/dovecot-lmtp
      virtual_mailbox_domains =
        proxy:mysql:/etc/postfix/sql/virtual_domains_maps.cf
      virtual_mailbox_maps =
        proxy:mysql:/etc/postfix/sql/virtual_mailbox_maps.cf,
        proxy:mysql:/etc/postfix/sql/virtual_alias_domain_mailbox_maps.cf
      virtual_alias_maps =
        proxy:mysql:/etc/postfix/sql/virtual_alias_maps.cf,
        proxy:mysql:/etc/postfix/sql/virtual_alias_domain_maps.cf,
        proxy:mysql:/etc/postfix/sql/virtual_alias_domain_catchall_maps.cf
      virtual_mailbox_base = /var/vmail
      virtual_minimum_uid = 2000
      virtual_uid_maps = static:2000
      virtual_gid_maps = static:2000

- name: Update postfix virtual domains config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_domains_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT domain FROM domain WHERE domain='%s' AND active = '1'
  no_log: yes

- name: Update postfix virtual mailbox maps config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_mailbox_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT maildir FROM mailbox WHERE username='%s' AND active = '1'
  no_log: yes

- name: Update postfix virtual alias domain mailbox maps config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_alias_domain_mailbox_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT maildir FROM mailbox,alias_domain WHERE alias_domain.alias_domain = '%d' and mailbox.username = CONCAT('%u', '@', alias_domain.target_domain) AND mailbox.active = 1 AND alias_domain.active='1'
  no_log: yes

- name: Update postfix virtual alias maps config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_alias_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT goto FROM alias WHERE address='%s' AND active = '1'
  no_log: yes

- name: Update postfix virtual alias domain maps config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_alias_domain_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT goto FROM alias,alias_domain WHERE alias_domain.alias_domain = '%d' and alias.address = CONCAT('%u', '@', alias_domain.target_domain) AND alias.active = 1 AND alias_domain.active='1'
  no_log: yes

- name: Update postfix virtual alias domain catchall config
  become: yes
  blockinfile:
    path: /etc/postfix/sql/virtual_alias_domain_catchall_maps.cf
    create: yes
    block: |
      user = postfix
      password = {{ mariadb_postfix_password }}
      hosts = 127.0.0.1
      dbname = postfix
      query = SELECT goto FROM alias,alias_domain WHERE alias_domain.alias_domain = '%d' and alias.address = CONCAT('@', alias_domain.target_domain) AND alias.active = 1 AND alias_domain.active='1'
  no_log: yes

- name: Update Redis config
  become: yes
  blockinfile:
    path: /etc/redis/redis.conf
    block: |
       maxmemory 256mb
       maxmemory-policy volatile-ttl
  notify:
    Restart Redis Service

- name: Update Rspamd worker-proxy config
  become: yes
  blockinfile:
    path: /etc/rspamd/worker-proxy.inc
    block: |
      bind_socket = "/var/spool/postfix/var/run/rspamd/milter.sock mode=0666 owner=_rspamd";

      upstream "local" {
        default = yes;
        hosts = "localhost";
        self_scan = yes;
      }
    marker_begin: "timeout = 120s; # Needed for Milter usually"
    marker_end: "count = 1; # Do not spawn too many processes of this type"
    marker: "{mark}"
    state: present

- name: Disable rspamd normal worker
  become: yes
  lineinfile:
    path: /etc/rspamd/worker-normal.inc
    line: enabled = false;

- name: Create socket with permissions for rspamd 
  become: yes
  shell: |
      mkdir -p /var/spool/postfix/var/run/rspamd/ && chown -R _rspamd:postfix /var/spool/postfix/var/run/rspamd/

- name: Create bayes classifier rspamd
  become: yes
  blockinfile: 
    path: /etc/rspamd/local.d/classifier-bayes.conf
    create: yes
    block: |
      servers = "127.0.0.1";
      backend = "redis";
      autolearn = true;

- name: rspamd config replies
  become: yes
  lineinfile:
    path: /etc/rspamd/local.d/replies.conf
    create: yes
    line: action = "no action";
  notify:
    - Restart Rspamd Service

- name: Create config for sieve
  become: yes
  blockinfile:
    create: yes
    path: /etc/dovecot/sieve/move-spam-to-junk.sieve
    block: |
      require ["fileinto"];
      if header :is "X-Spam" "Yes" {
              fileinto "Junk";
      }

- name: Sieve report config
  become: yes
  blockinfile:
    create: yes
    path: /etc/dovecot/sieve/report-{{ item.name }}.sieve
    block: |
       require ["vnd.dovecot.pipe", "copy", "imapsieve"];
       pipe :copy "learn-{{ item.name }}.sh";
  loop:
    - {name: ham}
    - {name: spam}

- name: Sieve report script
  become: yes
  blockinfile:
    create: yes
    path: /etc/dovecot/sieve/learn-{{ item.name }}.sh 
    block: |
      #!/bin/sh
      exec /usr/bin/rspamc learn_{{ item.name }}
  loop:
    - {name: ham}
    - {name: spam}

- name: Make Sieve script executable
  become: true
  ansible.builtin.file:
    path: "/etc/dovecot/sieve/learn-{{ item }}.sh"
    owner: root
    group: root
    mode: '0755'
    state: file
  loop:
    - spam
    - ham

- name: Make postfix sql executable
  become: yes
  shell: |
      chmod 640 /etc/postfix/sql/*
      setfacl -R -m u:postfix:r /etc/postfix/sql/*

- name: Ensure group vmail exists
  group:
    name: vmail
    state: present
    gid: 2000

- name: Add user vmail
  become: yes
  user:
    name: vmail
    group: vmail
    uid: 2000
    create_home: false

- name: Create Directory and give ownership
  become: true
  ansible.builtin.file:
    path: /var/vmail
    state: directory
    owner: vmail
    group: vmail
    recurse: true
  notify:
    - Restart Postfix Service
    - Restart Dovecot Service

- meta: flush_handlers

- name: Compile sieve config
  become: yes
  shell: |
    sievec /etc/dovecot/sieve/move-spam-to-junk.sieve && sievec /etc/dovecot/sieve/report-spam.sieve && sievec /etc/dovecot/sieve/report-ham.sieve

# Wedding-site assets are deployed by their own workflow, not this mail role.
# End of mailserver tasks.
